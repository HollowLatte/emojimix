<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>emojimix · 表情合成器</title>
<meta name="description" content="把两个 emoji 合成一个新表情。基于 Google Emoji Kitchen 素材。">
<meta name="theme-color" content="#6e823a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23ffd166'/%3E%3Ccircle cx='36' cy='42' r='6' fill='%23402a10'/%3E%3Ccircle cx='64' cy='42' r='6' fill='%23402a10'/%3E%3Cpath d='M28 62q22 22 44 0' stroke='%23402a10' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>emojimix</h1>
  <p class="tagline">滚动选两个表情，合成一个</p>
</header>

<nav class="tabs" role="tablist">
  <button class="tab is-active" data-tab="mix" role="tab">合成</button>
  <button class="tab" data-tab="fav" role="tab">收藏<span class="badge" id="favBadge" hidden>0</span></button>
</nav>

<main>
  <!-- ============ 合成面板 ============ -->
  <section class="panel is-active" id="panel-mix">

    <div class="mixer">
      <div class="side">
        <button class="mini" id="search1" aria-label="搜索第一个表情">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        </button>
        <button class="mini" id="shuffle1" aria-label="随机第一个表情">
          <svg viewBox="0 0 24 24"><path d="M3 7h4l4 5 4 5h4"/><path d="M3 17h4l4-5 4-5h4"/><path d="M18 4l3 3-3 3"/><path d="M18 14l3 3-3 3"/></svg>
        </button>
      </div>

      <div class="wheelbox">
        <div class="wheel" id="wheel1" tabindex="0" aria-label="第一个表情"></div>
        <div class="marker" aria-hidden="true"></div>
      </div>

      <div class="plus" aria-hidden="true">+</div>

      <div class="wheelbox">
        <div class="wheel" id="wheel2" tabindex="0" aria-label="第二个表情"></div>
        <div class="marker" aria-hidden="true"></div>
      </div>

      <div class="side">
        <button class="mini" id="search2" aria-label="搜索第二个表情">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
        </button>
        <button class="mini" id="shuffle2" aria-label="随机第二个表情">
          <svg viewBox="0 0 24 24"><path d="M3 7h4l4 5 4 5h4"/><path d="M3 17h4l4-5 4-5h4"/><path d="M18 4l3 3-3 3"/><path d="M18 14l3 3-3 3"/></svg>
        </button>
      </div>
    </div>

    <div class="stage" id="stage" title="点一下换一组">
      <img id="output" alt="合成结果" draggable="false" crossorigin="anonymous" hidden>
      <div class="placeholder" id="placeholder">
        <span class="ph-mark">?</span>
        <small>选好后自动合成</small>
      </div>
      <div class="no-mix" id="noMix" hidden>
        <span>这对没画过</span>
        <small>换一组试试</small>
      </div>
      <div class="spinner" id="spinner" hidden></div>
    </div>

    <button class="shuffle-all" id="shuffleAll" title="左右各摇一个，看看能撞出什么">
      <svg viewBox="0 0 24 24"><path d="M3 7h4l4 5 4 5h4"/><path d="M3 17h4l4-5 4-5h4"/><path d="M18 4l3 3-3 3"/><path d="M18 14l3 3-3 3"/></svg>
      开盲盒
    </button>

    <div class="actions">
      <button class="act" id="btnCopy" title="复制图片">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 6.5V5.5A2.5 2.5 0 0 0 12.5 3h-6A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14h1"/></svg>
        <span>复制</span>
      </button>
      <button class="act act-heart" id="btnHeart" title="收藏">
        <svg viewBox="0 0 24 24"><path d="M12 20.3 4.9 13.2a4.7 4.7 0 0 1 6.6-6.6l.5.5.5-.5a4.7 4.7 0 0 1 6.6 6.6Z"/></svg>
        <span>收藏</span>
      </button>
      <button class="act" id="btnDownload" title="保存 PNG">
        <svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M7.5 10 12 14.5 16.5 10"/><path d="M4 19h16"/></svg>
        <span>保存</span>
      </button>
      <button class="act" id="btnShare" title="分享">
        <svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 7.5 12 3.5l4 4"/><path d="M5 13v5.5A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V13"/></svg>
        <span>分享</span>
      </button>
    </div>

    <p class="hint" id="hint">小技巧：滚轮中间那格才是选中项；点「开盲盒」或直接点大图，一键换一组</p>
  </section>

  <!-- ============ 收藏面板 ============ -->
  <section class="panel" id="panel-fav">
    <div class="fav-head">
      <p>只存在这台设备上</p>
      <button class="textbtn" id="btnClearFav">清空</button>
    </div>
    <div class="fav-grid" id="favGrid"></div>
    <div class="empty" id="favEmpty">
      <span>♡</span>
      <p>还没有收藏</p>
      <small>点合成页的爱心把喜欢的组合留下来</small>
    </div>
  </section>
</main>

<footer>
  <button class="textbtn" data-open="settings">设置</button>
  <span class="dot">·</span>
  <button class="textbtn" data-open="credits">素材来源</button>
</footer>

<!-- ============ 搜索弹层 ============ -->
<div class="sheet-backdrop" id="searchBackdrop" hidden></div>
<div class="sheet" id="searchSheet" hidden role="dialog" aria-label="搜索表情">
  <div class="sheet-grab"></div>
  <div class="search-bar">
    <svg viewBox="0 0 24 24" class="search-ico"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <input id="searchInput" type="text" placeholder="搜索，比如「笑」「心」「猫」" autocomplete="off" spellcheck="false">
    <button class="textbtn" data-close>完成</button>
  </div>
  <div class="search-grid" id="searchGrid"></div>
  <p class="search-empty" id="searchEmpty" hidden>没找到，换个词试试</p>
</div>

<!-- ============ 设置弹层 ============ -->
<div class="sheet-backdrop" id="settingsBackdrop" hidden></div>
<div class="sheet" id="settingsSheet" hidden role="dialog" aria-label="设置">
  <div class="sheet-grab"></div>
  <h2>设置</h2>
  <div class="row">
    <span>主题</span>
    <div class="segmented" id="themeSeg">
      <button data-theme-val="auto">跟随系统</button>
      <button data-theme-val="light">浅色</button>
      <button data-theme-val="dark">深色</button>
    </div>
  </div>
  <div class="row">
    <span>滚动音效</span>
    <button class="switch is-on" id="soundSwitch" role="switch" aria-checked="true"><i></i></button>
  </div>
  <div class="row">
    <span>震动反馈</span>
    <button class="switch is-on" id="vibeSwitch" role="switch" aria-checked="true"><i></i></button>
  </div>
  <button class="widebtn" data-close>返回</button>
</div>

<!-- ============ 素材来源 ============ -->
<div class="sheet-backdrop" id="creditsBackdrop" hidden></div>
<div class="sheet" id="creditsSheet" hidden role="dialog" aria-label="素材来源">
  <div class="sheet-grab"></div>
  <h2>素材来源</h2>
  <p class="credits-p">全部合成插画来自 Google 的 <a href="https://emojikitchen.dev" target="_blank" rel="noopener">Emoji Kitchen</a>，版权归 Google 所有。</p>
  <p class="credits-p">单个表情插画来自 Google Noto Emoji，中文名称来自 emojibase。</p>
  <p class="credits-p">这个页面是对 Tikolu 的 emojimix 的复刻实现，交互逻辑相同，代码独立编写。</p>
  <button class="widebtn" data-close>返回</button>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="zh.js"></script>
<script src="app.js"></script>
</body>
</html>
